[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiftui-migrate"
version = "0.1.0"
description = "Scan Swift/SwiftUI codebases for deprecated or fragile API usage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
swiftui-migrate = "swiftui_migrate.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/swiftui-migrate"
Repository = "https://github.com/yourusername/swiftui-migrate"

[tool.hatch.build.targets.wheel]
packages = ["src/swiftui_migrate"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
